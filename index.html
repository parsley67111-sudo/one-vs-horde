(()=>{'use strict';const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id),DURATION=180;let W=0,H=0,dpr=1,game=null,last=0,keys={},touch=null,raf=0;const rand=(a,b)=>a+Math.random()*(b-a),clamp=(n,a,b)=>Math.max(a,Math.min(b,n));function resize(){dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();function best(){return Number(localStorage.getItem('horde_best')||0)}$('best').textContent='Рекорд убийств: '+best();function show(title,message,choices=[]){$('heading').textContent=title;$('message').textContent=message;$('overlay').style.display='flex';$('choices').replaceChildren();$('mainBtn').style.display=choices.length?'none':'inline-block';for(const [name,desc,apply] of choices){const b=document.createElement('button');b.textContent=name+' — '+desc;b.onclick=()=>{apply();$('overlay').style.display='none';game.mode='play';last=performance.now()};$('choices').append(b)}}function start(){game={mode:'play',time:0,spawn:0,shot:0,kills:0,level:1,particles:[],numbers:[],shake:0,xp:0,next:5,enemies:[],bullets:[],gems:[],player:{x:W/2,y:H/2,r:14,hp:5,maxHp:5,speed:215,damage:1,fire:.55,shots:1,inv:0,crit:.12,critMult:2,magnet:115,knock:115,facingX:0,facingY:1,moving:false}};$('overlay').style.display='none';last=performance.now()}$('mainBtn').onclick=start;const upgrades=[['⚔ Урон','+1 урон',p=>p.damage++],['🏹 Скорострельность','выстрелы на 15% чаще',p=>p.fire=Math.max(.12,p.fire*.85)],['👟 Скорость','+15% к движению',p=>p.speed*=1.15],['♥ Здоровье','+1 максимум и лечение',p=>{p.maxHp++;p.hp=Math.min(p.maxHp,p.hp+2)}],['✨ Дополнительный снаряд','+1 снаряд за залп',p=>p.shots=Math.min(6,p.shots+1)],['🎯 Меткий глаз','+8% к шансу крита',p=>p.crit=Math.min(.65,p.crit+.08)],['🧲 Магнит','+45 к радиусу притяжения опыта',p=>p.magnet+=45],['💥 Сильный удар','+35% к отбрасыванию',p=>p.knock*=1.35]];function le
