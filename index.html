<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Один против орды — v0.3</title><style>
*{box-sizing:border-box}body{margin:0;background:#10151d;color:#f4ebd8;font:16px system-ui,Arial;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;touch-action:none}#hud{position:fixed;left:12px;top:10px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font-weight:800;text-shadow:0 2px 3px #000}#hp{color:#ff8888}#xp{color:#a8e9ff}#overlay{position:fixed;inset:0;background:#071018d9;display:flex;align-items:center;justify-content:center;padding:18px}#panel{background:#202d38;border:2px solid #8aa5ac;border-radius:18px;padding:24px;max-width:480px;width:100%;text-align:center;box-shadow:0 12px 50px #0008}h1{margin:0 0 10px;color:#f6d68a;font-size:clamp(25px,6vw,38px)}p{line-height:1.5;color:#c9d4d9}button{background:#eec57e;color:#20242b;border:0;border-radius:11px;padding:13px 20px;font-weight:900;font-size:16px;cursor:pointer;margin:6px}button:hover{filter:brightness(1.1)}#choices{display:grid;gap:8px}#choices button{margin:0;text-align:left}#stick{position:fixed;left:24px;bottom:24px;width:118px;height:118px;border:2px solid #c8d8e166;border-radius:50%;background:#b3c7d21a;display:none;pointer-events:none}#nub{position:absolute;width:48px;height:48px;left:33px;top:33px;background:#e8cf9a99;border-radius:50%}@media(pointer:coarse){#stick{display:block}}small{color:#aabac5}#version{position:fixed;right:12px;bottom:8px;color:#aabac588;font-size:11px;pointer-events:none}#panel{max-height:90dvh;overflow:auto}</style></head><body><canvas id="game"></canvas><div id="hud"><span id="hp">♥ 5/5</span><span id="time">03:00</span><span id="xp">Ур. 1 · Опыт 0/5</span><span id="kills">☠ 0</span></div><div id="version">v0.3 · Пиксельный герой</div><div id="stick"><div id="nub"></div></div><div id="overlay"><div id="panel"><h1 id="heading">⚔ Один против орды</h1><p id="message">Выживи 3 минуты. Двигайся WASD или стрелками; на телефоне — пальцем по экрану. Герой стреляет автоматически. Собирай голубые кристаллы опыта.</p><div id="choices"></div><button id="mainBtn">Начать бой</button><p><small id="best"></small></p></div></div><script>
(()=>{'use strict';const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id),DURATION=180;let W=0,H=0,dpr=1,game=null,last=0,keys={},touch=null,raf=0;// Pixel-art hero: independently animated legs, scarf, weapon and recoil.
const heroCanvas=document.createElement('canvas');heroCanvas.width=48;heroCanvas.height=48;
const hc=heroCanvas.getContext('2d');hc.imageSmoothingEnabled=false;
function heroArt(p,t){
 hc.clearRect(0,0,48,48);
 const moving=!!p.moving,phase=t*13,step=moving?Math.sin(phase):0;
 const facing=Math.atan2(p.facingY||1,p.facingX||0);
 const firing=(p.fireFx||0)>0,aim=p.aimAngle??facing;
 const dying=p.deathTime!==undefined,deadProgress=dying?Math.min(1,p.deathTime/.75):0;
 const hurt=p.inv>0&&Math.floor(p.inv*14)%2===0;
 const px=(x,y,w,h,c)=>{hc.fillStyle=c;hc.fillRect(Math.round(x),Math.round(y),w,h)};
 const C={edge:'#1b1825',hair:'#382632',hair2:'#704238',skin:'#f2aa7d',light:'#ffd19a',scarf:'#e33d47',scarf2:'#a51e3c',coat:'#384b63',coat2:'#64778c',pants:'#253246',boot:'#201d2c',metal:'#b2bac9',gun:'#343b50'};
 hc.save();hc.translate(24,25);
 if(dying){hc.rotate(-deadProgress*1.4);hc.translate(0,deadProgress*11);hc.globalAlpha=1-deadProgress*.6}
 // floor shadow
 hc.fillStyle='#0b101a80';hc.beginPath();hc.ellipse(0,14,12,4,0,0,Math.PI*2);hc.fill();
 const side=Math.cos(facing),front=Math.sin(facing)>-.3;
 const bounce=moving?Math.abs(step)*1.4:Math.sin(t*3)*.45;
 // feet, alternating in walk cycle
 px(-8,7+step*3,6,9,C.edge);px(-7,7+step*3,5,7,C.boot);
 px(3,7-step*3,6,9,C.edge);px(4,7-step*3,5,7,C.boot);
 px(-7,-2-bounce,15,13,C.edge);px(-5,-1-bounce,11,10,C.coat);
 px(-4,4-bounce,9,3,C.coat2);
 // trailing scarf sways independently
 const scarfWave=Math.sin(t*9)*2+(moving?step*2:0);
 const tailDir=side>=0?-1:1;
 px(tailDir*9,-9+scarfWave,10,4,C.scarf2);px(tailDir*13,-11+scarfWave,8,3,C.scarf);
 // head / hair
 px(-9,-19-bounce,19,17,C.edge);px(-7,-17-bounce,15,14,C.skin);
 px(-10,-20-bounce,19,8,C.hair);px(-7,-22-bounce,13,5,C.hair2);
 px(-4,-22-bounce,8,3,C.hair);
 if(front){px(-4,-11-bounce,3,3,C.edge);px(4,-11-bounce,3,3,C.edge);px(-3,-12-bounce,1,1,C.light)}
 else {px(-4,-12-bounce,12,4,C.hair2)}
 px(-9,-5-bounce,19,5,C.scarf2);px(-7,-6-bounce,15,4,C.scarf);
 // arms + gun track nearest target independently from walking
 hc.save();hc.translate(0,-1-bounce);
 hc.rotate(aim);
 const recoil=firing?3*Math.max(0,p.fireFx/.13):0;
 px(0,-4,12,8,C.edge);px(1,-3,9,6,C.coat2);
 px(4-recoil,-3,18,7,C.edge);px(7-recoil,-2,13,5,C.gun);
 px(13-recoil,-1,6,2,C.metal);px(19-recoil,-2,6,3,C.edge);
 px(11-recoil,3,4,7,C.edge);px(12-recoil,4,2,5,C.boot);
 if(firing){px(25-recoil,-3,7,5,'#ffae40');px(30-recoil,-1,7,2,'#fff1a1');px(27-recoil,-6,3,11,'#ffcf55')}
 hc.restore();
 if(hurt){hc.globalCompositeOperation='source-atop';hc.fillStyle='#fff2d4aa';hc.fillRect(-24,-25,48,48);hc.globalCompositeOperation='source-over'}
 hc.restore();
 return heroCanvas;
}
function draw(){ctx.fillStyle='#18242b';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#314047';ctx.lineWidth=1;for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}if(!game)return;const g=game,p=g.player;ctx.save();if(g.shake>0)ctx.translate(rand(-g.shake,g.shake),rand(-g.shake,g.shake));for(const a of g.gems){ctx.fillStyle='#80e9ff';ctx.beginPath();ctx.moveTo(a.x,a.y-7);ctx.lineTo(a.x+6,a.y);ctx.lineTo(a.x,a.y+7);ctx.lineTo(a.x-6,a.y);ctx.fill()}for(const e of g.enemies){ctx.fillStyle=e.hit?'#fff':e.kind==='fast'?'#ef9b5c':e.kind==='tank'?'#9159a9':'#80b86e';ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#15252a';ctx.fillRect(e.x-6,e.y-3,4,4);ctx.fillRect(e.x+3,e.y-3,4,4);if(e.hp<e.max){ctx.fillStyle='#e76363';ctx.fillRect(e.x-e.r,e.y-e.r-8,2*e.r*e.hp/e.max,3)}}for(const b of g.bullets){ctx.fillStyle='#ffd47d';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill()}{const frame=heroArt(p,g.time);ctx.save();ctx.imageSmoothingEnabled=false;ctx.drawImage(frame,Math.round(p.x-28),Math.round(p.y-32),56,56);ctx.restore()}for(const q of g.particles){ctx.globalAlpha=Math.max(0,q.life/q.max);ctx.fillStyle=q.color;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.textAlign='center';ctx.textBaseline='middle';for(const n of g.numbers){ctx.globalAlpha=Math.min(1,n.life/.2);ctx.font=n.crit?'bold 21px system-ui':'bold 15px system-ui';ctx.lineWidth=3;ctx.strokeStyle='#15202c';ctx.strokeText(n.text,n.x,n.y);ctx.fillStyle=n.crit?'#ffe28a':'#f7f1df';ctx.fillText(n.text,n.x,n.y)}ctx.globalAlpha=1;ctx.restore()}function frame(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;update(dt);draw();raf=requestAnimationFrame(frame)}raf=requestAnimationFrame(frame);addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()});addEventListener('keyup',e=>keys[e.key]=false);canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;touch={id:e.pointerId,x:e.clientX,y:e.clientY,vx:0,vy:0};canvas.setPointerCapture(e.pointerId);moveTouch(e)});function moveTouch(e){if(!touch||touch.id!==e.pointerId)return;const dx=e.clientX-touch.x,dy=e.clientY-touch.y,m=Math.max(1,Math.hypot(dx,dy));touch.vx=dx/m*Math.min(1,m/45);touch.vy=dy/m*Math.min(1,m/45);$('nub').style.transform=`translate(${touch.vx*33}px,${touch.vy*33}px)`}canvas.addEventListener('pointermove',moveTouch);function endTouch(e){if(touch&&touch.id===e.pointerId){touch=null;$('nub').style.transform=''}}canvas.addEventListener('pointerup',endTouch);canvas.addEventListener('pointercancel',endTouch);
})();</script></body></html>
